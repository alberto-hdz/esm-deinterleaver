name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install numpy pytest

      # CMake comes preinstalled on the runner. GoogleTest gets downloaded by
      # CMakeLists.txt, so nothing here depends on Ubuntu's apt mirrors.
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Python tests
        run: pytest -q sim/tests

      - name: Smoke test on a simulated scenario
        run: |
          python sim/scenario.py --emitters 6 --seed 1 --out data/ci
          ./build/esm_cli --pdw data/ci/pdw.csv --show-truth
